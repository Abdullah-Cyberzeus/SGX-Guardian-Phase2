[package]
name = "sgx-pa-cli"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
p256 = { version = "0.13", features = ["ecdsa"] }
sha2 = "0.10"
rand_core = "0.6"
base64 = { version = "0.21", features = ["alloc"] }
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
comfy-table = "7.1"
ring = "0.17"
hex = "0.4"

[dev-dependencies]
assert_cmd = "2.1.1"
tempfile = "3.23.0"

[lib]
doctest = false
