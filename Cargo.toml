[package]
name = "sgx_guardian_client"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
build = "build.rs"

[dependencies]
tonic = { version = "0.14.5", features = ["transport", "tls-native-roots", "tls-ring"] }
tonic-prost = "0.14.2"
prost = "0.14.3"
prost-types = "0.14.3"
tokio = { version = "1.37", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "json", "chrono"] }
tracing-appender = "0.2"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
windows-sys = { version = "0.52", features = ["Win32_System_Console"] }
anyhow = "1"
ring = "0.17.14"
base64 = "0.21"
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
rustls = "0.23.37"
rcgen = "0.12"
pem = "3.0"
p256 = { version = "0.13", features = ["ecdsa"] }
once_cell = "1.19"
warp = { version = "0.3", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
async-trait = "0.1"
dashmap = "5.5"
network-interface = "2.0"
uuid = { version = "1", features = ["v4","serde"] }

[build-dependencies]
tonic-prost-build = "0.14.2"

[dev-dependencies]
rcgen = "0.12"
tempfile = "3.8"
uuid = { version = "1", features = ["v4"] }

[features]
default = []
secure-element = []

[workspace]
members = ["sgx-pa-cli"]

[lib]
doctest = false
