[package]
name = "sgx_guardian_client"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
build = "build.rs"

[dependencies]
axum = { version = "0.8", features = ["macros", "multipart"] }
tonic = { version = "0.14.5", features = ["transport", "tls-native-roots", "tls-ring"] }
tonic-prost = "0.14.5"
prost = "0.14.3"
prost-types = "0.14.3"
tokio = { version = "1.37", features = ["full"] }
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "json", "chrono"] }
tracing-appender = "0.2"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
windows-sys = { version = "0.52", features = ["Win32_System_Console"] }
anyhow = "1"
ring = "0.17.14"
rand = "0.8"
base64 = "0.22"
flate2 = "1"
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
ipnet = "2"
rustls = { version = "0.23.38", default-features = false, features = ["ring", "std", "tls12"] }
bs58 = "0.5"
thiserror = "2"
rcgen = "0.12"
pem = "3.0"
p256 = { version = "0.13", features = ["ecdsa"] }
once_cell = "1.19"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
async-trait = "0.1"
dashmap = "5.5"
network-interface = "2.0"
libmdns = "0.9"
uuid = { version = "1", features = ["v4","serde"] }
libc = "0.2"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tempfile = "3.8"
quick-xml = { version = "0.41", features = ["serialize"] }
which = "8"

[build-dependencies]
tonic-prost-build = "0.14.5"

[dev-dependencies]
rcgen = "0.12"
uuid = { version = "1", features = ["v4"] }

[features]
default = ["secure-element"]
secure-element = []

[workspace]
members = ["sgx-pa-cli"]

[lib]
doctest = false
