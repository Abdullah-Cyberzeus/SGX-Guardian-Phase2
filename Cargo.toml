[package]
name = "sgx_guardian_client"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
build = "build.rs"

[dependencies]
tonic = { version = "0.10.2", features = ["tls", "tls-roots", "transport"] }
prost = "0.12.6"
prost-types = "0.12.6"
tokio = { version = "1.37", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "json", "chrono"] }
tracing-appender = "0.2"
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
windows-sys = { version = "0.52", features = ["Win32_System_Console"] }
anyhow = "1"
ring = "0.17.14"
base64 = "0.21"
libmdns = "0.7"
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
rustls = "0.21.11"
rustls-pemfile = "1.0"
tokio-rustls = "0.24.1"
rcgen = "0.12"
pem = "1.1"
p256 = { version = "0.13", features = ["ecdsa"] }
once_cell = "1.19"

[build-dependencies]
tonic-build = "0.10.2"

[dev-dependencies]
rcgen = "0.12"
tempfile = "3.8"
uuid = { version = "1", features = ["v4"] }

[workspace]
members = ["sgx-pa-cli"]

[lib]
doctest = false
