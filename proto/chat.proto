syntax = "proto3";

package sgx;

service ChatService {
  // Pushes a secure, hardware-signed chat message to a peer node
  rpc PushMessage(PushMessageRequest) returns (PushMessageResponse);

  // Pushes a read receipt to the original sender over the P2P tunnel
  rpc PushReceipt(PushReceiptRequest) returns (PushReceiptResponse);

  // Synchronizes missed messages using server-side streaming
  rpc SyncMessages(SyncRequest) returns (stream PushMessageRequest);

  // Streams a chat attachment from the Guardian that owns the bytes. The
  // caller is authenticated by its attested Guardian DID before any data is
  // returned; chunks keep individual gRPC messages small for 50 MiB files.
  rpc GetAttachment(GetAttachmentRequest) returns (stream AttachmentChunk);
}

message PushMessageRequest {
  string message_id = 1;
  string sender_did = 2;
  string recipient_did = 3;
  int64 timestamp = 4;
  uint64 seq_no = 5;
  string encrypted_payload = 6;
  string signature = 7;
  string group_id = 8;
  // Guardian DID that authenticated and relayed this envelope. This differs
  // from sender_did when a browser PWA member authored the message.
  string relay_did = 9;
}

message PushMessageResponse {
  string message_id = 1;
  string status = 2; // e.g., "delivered", "error"
}

message PushReceiptRequest {
  string message_id = 1;
  string reader_did = 2; // The DID of the peer who read the message
  int64 timestamp = 3;   // The UTC epoch timestamp of when it was read
  string group_id = 4;   // Group ID (e.g., "circle"), or empty for P2P
}

message PushReceiptResponse {
  string message_id = 1;
  string status = 2; // e.g., "receipt_logged"
}

message SyncRequest {
  string requester_did = 1;
  uint64 last_known_seq_no = 2;
}

message GetAttachmentRequest {
  string requester_did = 1;
  string attachment_id = 2;
}

message AttachmentChunk {
  string attachment_id = 1;
  string file_name = 2;
  string mime_type = 3;
  uint64 total_size = 4;
  string sha256_hash = 5;
  bytes data = 6;
}
