name: sgx-guardian-dev

x-guardian-common: &guardian-common
  build:
    context: .
    dockerfile: docker/Dockerfile.agent
  image: sgx-guardian:dev
  cap_add:
    - NET_ADMIN
  devices:
    - /dev/net/tun:/dev/net/tun
  extra_hosts:
    - "host.docker.internal:host-gateway"
  env_file: .env
  environment: &guardian-env
    RUST_LOG: info
    SGX_FORCE_SOFTWARE_KEYS: "1"
    SGX_DISABLE_SECURE_BOOT_CHECK: "1"
    SGX_DISABLE_READ_OCOTP: "1"
    SGX_DISABLE_DKP_ROTATION: "1"
    SGX_DISABLE_COT_BLUETOOTH: "1"
    SGX_DISABLE_COT_CELLULAR: "1"
    SGX_DISABLE_COT_SATELLITE: "1"
    SGX_SIM_MODE: "true"
    SGX_DISABLE_POLICY_ENFORCEMENT: "1"
    SGX_ADMIN_TLS_ENABLED: "1"
    SGX_ADMIN_REQUIRE_HTTPS: "1"
  restart: unless-stopped

services:
  nodeA:
    <<: *guardian-common
    container_name: sgx-nodeA
    hostname: sgx-nodeA
    environment:
      <<: *guardian-env
      NODE_ID: nodeA
      # Per-node TPM handles: 0x10 spacing leaves headroom for dkp.rs::rotate()
      # (new_handle = base + version - 1) before colliding with the next node's base.
      SGX_TPM_DKP_HANDLE_BASE: "0x81000010"
      SGX_TPM_DIK_HANDLE: "0x81000100"
      SGX_TPM_KEY_AUTH: "${NODEA_TPM_KEY_AUTH:-}"
      SGX_DUSAGE_SAMPLE_SECS: "15"
      SGX_DUSAGE_CATEGORIES_ENABLED: "1"
      SGX_CALL_SIGNALING_PORT: "50065"
    networks:
      sgxnet:
        ipv4_address: 172.31.250.10
    ports:
      - "18443:8443"
    volumes:
      - nodeA-etc:/etc/sgx-guardian
      - nodeA-lib:/var/lib/sgx-guardian
      - nodeA-log:/var/log/sgx-guardian
    healthcheck:
      test: ["CMD", "curl", "-ksf", "https://127.0.0.1:8443/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  nodeB:
    <<: *guardian-common
    container_name: sgx-nodeB
    hostname: sgx-nodeB
    environment:
      <<: *guardian-env
      NODE_ID: nodeB
      SGX_LIGHTHOUSE_IP: 172.31.250.10
      SGX_TPM_DKP_HANDLE_BASE: "0x81000020"
      SGX_TPM_DIK_HANDLE: "0x81000110"
      SGX_TPM_KEY_AUTH: "${NODEB_TPM_KEY_AUTH:-}"
      SGX_CALL_SIGNALING_PORT: "50065"
    networks:
      sgxnet:
        ipv4_address: 172.31.250.11
    ports:
      - "28443:8443"
    volumes:
      - nodeB-etc:/etc/sgx-guardian
      - nodeB-lib:/var/lib/sgx-guardian
      - nodeB-log:/var/log/sgx-guardian
    depends_on:
      nodeA:
        condition: service_healthy

  nodeC:
    <<: *guardian-common
    container_name: sgx-nodeC
    hostname: sgx-nodeC
    environment:
      <<: *guardian-env
      NODE_ID: nodeC
      SGX_LIGHTHOUSE_IP: 172.31.250.10
      SGX_TPM_DKP_HANDLE_BASE: "0x81000030"
      SGX_TPM_DIK_HANDLE: "0x81000120"
      SGX_TPM_KEY_AUTH: "${NODEC_TPM_KEY_AUTH:-}"
      SGX_CALL_SIGNALING_PORT: "50065"
    networks:
      sgxnet:
        ipv4_address: 172.31.250.12
    ports:
      - "38443:8443"
    volumes:
      - nodeC-etc:/etc/sgx-guardian
      - nodeC-lib:/var/lib/sgx-guardian
      - nodeC-log:/var/log/sgx-guardian
    depends_on:
      nodeA:
        condition: service_healthy

networks:
  sgxnet:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.250.0/24

volumes:
  nodeA-etc: {}
  nodeA-lib: {}
  nodeA-log: {}
  nodeB-etc: {}
  nodeB-lib: {}
  nodeB-log: {}
  nodeC-etc: {}
  nodeC-lib: {}
  nodeC-log: {}
