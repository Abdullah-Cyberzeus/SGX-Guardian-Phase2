name: sgx-guardian-dev

x-guardian-common: &guardian-common
  build:
    context: .
    dockerfile: docker/Dockerfile.agent
    args:
      # These are public OIDC client settings embedded in the browser bundle.
      # Never add SGX_CYLENIUM_OIDC_CLIENT_SECRET here.
      VITE_CYLENIUM_BASE_URL: "${VITE_CYLENIUM_BASE_URL:-http://localhost:4000}"
      VITE_CYLENIUM_CLIENT_ID: "${VITE_CYLENIUM_CLIENT_ID:-sg_x_guardian_44b2f63d}"
      VITE_CYLENIUM_SCOPE: "${VITE_CYLENIUM_SCOPE:-openid profile email}"
  image: sgx-guardian:dev
  cap_add:
    - NET_ADMIN
  devices:
    - /dev/net/tun:/dev/net/tun
  extra_hosts:
    - "host.docker.internal:host-gateway"
  env_file: .env
  environment: &guardian-env
    RUST_LOG: info
    SGX_FORCE_SOFTWARE_KEYS: "1"
    SGX_DISABLE_SECURE_BOOT_CHECK: "1"
    SGX_DISABLE_READ_OCOTP: "1"
    SGX_DISABLE_DKP_ROTATION: "1"
    SGX_DISABLE_COT_BLUETOOTH: "1"
    SGX_DISABLE_COT_CELLULAR: "1"
    SGX_DISABLE_COT_SATELLITE: "1"
    SGX_SIM_MODE: "true"
    SGX_DISABLE_POLICY_ENFORCEMENT: "1"
    # Guardian stays HTTP only inside the private Compose network. Caddy is the
    # LAN TLS boundary for nodea.guardian/nodeb.guardian/nodec.guardian.
    SGX_ADMIN_TLS_ENABLED: "0"
    SGX_ADMIN_REQUIRE_HTTPS: "0"
    SGX_SSO_CYLENIUM_ENABLED: "1"
    SGX_CYLENIUM_OIDC_ISSUER: "${SGX_CYLENIUM_OIDC_ISSUER:-http://localhost:4000}"
    SGX_CYLENIUM_OIDC_TOKEN_ENDPOINT: "${SGX_CYLENIUM_OIDC_TOKEN_ENDPOINT:-http://host.docker.internal:4000/token}"
    SGX_CYLENIUM_OIDC_JWKS_URI: "${SGX_CYLENIUM_OIDC_JWKS_URI:-http://host.docker.internal:4000/.well-known/jwks.json}"
    SGX_CYLENIUM_OIDC_CLIENT_ID: "${SGX_CYLENIUM_OIDC_CLIENT_ID:-sg_x_guardian_44b2f63d}"
    SGX_CYLENIUM_OIDC_CLIENT_SECRET: "${SGX_CYLENIUM_OIDC_CLIENT_SECRET:-}"
    SGX_CYLENIUM_OIDC_REDIRECT_URI: "${SGX_CYLENIUM_OIDC_REDIRECT_URI:-http://localhost:3001/auth/callback}"
  restart: unless-stopped

services:
  nodeA:
    <<: *guardian-common
    container_name: sgx-nodeA
    hostname: nodea.guardian
    environment:
      <<: *guardian-env
      NODE_ID: nodeA
      # Per-node TPM handles: 0x10 spacing leaves headroom for dkp.rs::rotate()
      # (new_handle = base + version - 1) before colliding with the next node's base.
      SGX_TPM_DKP_HANDLE_BASE: "0x81000010"
      SGX_TPM_DIK_HANDLE: "0x81000100"
      SGX_TPM_KEY_AUTH: "${NODEA_TPM_KEY_AUTH:-}"
      SGX_DUSAGE_SAMPLE_SECS: "15"
      SGX_DUSAGE_CATEGORIES_ENABLED: "1"
      SGX_CALL_SIGNALING_PORT: "50065"
      SGX_CYLENIUM_OIDC_REDIRECT_URI: "${NODEA_CYLENIUM_REDIRECT_URI:-https://nodea.guardian/auth/callback}"
    networks:
      sgxnet:
        ipv4_address: 172.31.250.10
        aliases:
          - guardian1.com
    ports:
      - "127.0.0.1:18443:8443"
    volumes:
      - nodeA-etc:/etc/sgx-guardian
      - nodeA-lib:/var/lib/sgx-guardian
      - nodeA-log:/var/log/sgx-guardian
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8443/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  nodeB:
    <<: *guardian-common
    container_name: sgx-nodeB
    hostname: nodeb.guardian
    environment:
      <<: *guardian-env
      NODE_ID: nodeB
      SGX_LIGHTHOUSE_IP: 172.31.250.10
      SGX_TPM_DKP_HANDLE_BASE: "0x81000020"
      SGX_TPM_DIK_HANDLE: "0x81000110"
      SGX_TPM_KEY_AUTH: "${NODEB_TPM_KEY_AUTH:-}"
      SGX_CALL_SIGNALING_PORT: "50065"
      SGX_CYLENIUM_OIDC_REDIRECT_URI: "${NODEB_CYLENIUM_REDIRECT_URI:-https://nodeb.guardian/auth/callback}"
    networks:
      sgxnet:
        ipv4_address: 172.31.250.11
        aliases:
          - guardian2.com
    ports:
      - "127.0.0.1:28443:8443"
    volumes:
      - nodeB-etc:/etc/sgx-guardian
      - nodeB-lib:/var/lib/sgx-guardian
      - nodeB-log:/var/log/sgx-guardian
    depends_on:
      nodeA:
        condition: service_healthy

  nodeC:
    <<: *guardian-common
    container_name: sgx-nodeC
    hostname: nodec.guardian
    environment:
      <<: *guardian-env
      NODE_ID: nodeC
      SGX_LIGHTHOUSE_IP: 172.31.250.10
      SGX_TPM_DKP_HANDLE_BASE: "0x81000030"
      SGX_TPM_DIK_HANDLE: "0x81000120"
      SGX_TPM_KEY_AUTH: "${NODEC_TPM_KEY_AUTH:-}"
      SGX_CALL_SIGNALING_PORT: "50065"
      SGX_CYLENIUM_OIDC_REDIRECT_URI: "${NODEC_CYLENIUM_REDIRECT_URI:-https://nodec.guardian/auth/callback}"
    networks:
      sgxnet:
        ipv4_address: 172.31.250.12
        aliases:
          - guardian3.com
    ports:
      - "127.0.0.1:38443:8443"
    volumes:
      - nodeC-etc:/etc/sgx-guardian
      - nodeC-lib:/var/lib/sgx-guardian
      - nodeC-log:/var/log/sgx-guardian
    depends_on:
      nodeA:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    container_name: sgx-guardian-lan-tls
    restart: unless-stopped
    ports:
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./docker/Caddyfile.dev:/etc/caddy/Caddyfile:ro
      - guardian-caddy-data:/data
      - guardian-caddy-config:/config
    networks:
      - sgxnet
    depends_on:
      nodeA:
        condition: service_healthy
      nodeB:
        condition: service_started
      nodeC:
        condition: service_started

networks:
  sgxnet:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.250.0/24

volumes:
  nodeA-etc: {}
  nodeA-lib: {}
  nodeA-log: {}
  nodeB-etc: {}
  nodeB-lib: {}
  nodeB-log: {}
  nodeC-etc: {}
  nodeC-lib: {}
  nodeC-log: {}
  guardian-caddy-data: {}
  guardian-caddy-config: {}
