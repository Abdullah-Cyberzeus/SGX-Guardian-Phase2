[licenses]
allow = ["Apache-2.0", "MIT", "BSD-3-Clause", "Unicode-3.0", "Unicode-DFS-2016", "ISC", "MPL-2.0", "Zlib", "CDLA-Permissive-2.0"]
unused-allowed-license = "allow"

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"      
wildcards = "deny"             

#  Explicitly ignore only harmless known system-level duplicates
skip = [
    { name = "getrandom" },
    { name = "hashbrown" },
    { name = "socket2" },
    # libmdns still depends on thiserror 1.x while newer infra crates use 2.x.
    { name = "thiserror" },
    { name = "thiserror-impl" },
    { name = "windows-sys" },
]
