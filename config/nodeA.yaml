---
node_id: "nodeA"
hostname: "guardian-node-A"
ip: "127.0.0.1"
port: 50051
public_key: "placeholder-key-A"

relay:
  enabled: false
  max_peers: 5
  max_bandwidth_mbps: 0
  alert_threshold_pct: 80

api:
  tls:
    enabled: true
    require_https: true
    cert_path: "/var/lib/sgx-guardian/sgx-agent/device_nodeA_cert.der"
    key_path: "/var/lib/sgx-guardian/sgx-agent/device_nodeA.key"

secure_element:
  enabled: true
  scp_key_path: "/etc/sgx-guardian/secure-element/scp_keys.txt"
  interface: "t1oi2c"
  auth_type: "PlatformSCP"
  connection_type: "se05x"
