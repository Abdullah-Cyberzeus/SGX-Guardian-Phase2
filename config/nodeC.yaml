---
node_id: "nodeC"
hostname: "nodec.guardian"
ip: "127.0.0.1"
port: 50053
public_key: "placeholder-key-C"

api:
  tls:
    enabled: true
    require_https: true
    cert_path: "/var/lib/sgx-guardian/sgx-agent/device_nodeC_cert.der"
    key_path: "/var/lib/sgx-guardian/sgx-agent/device_nodeC.key"

relay:
  enabled: false
  max_peers: 5
  max_bandwidth_mbps: 0
  alert_threshold_pct: 80

secure_element:
  enabled: true
  scp_key_path: "/etc/sgx-guardian/secure-element/scp_keys.txt"
  interface: "t1oi2c"
  auth_type: "PlatformSCP"
  connection_type: "se05x"
