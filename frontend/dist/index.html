
  <!DOCTYPE html>
  <html lang="en" class="dark">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <link rel="icon" type="image/png" href="/favicon.png" />
      <link rel="apple-touch-icon" href="/favicon.png" />
      <title>SG-X Guardian</title>
      <!-- Apply the saved theme before first paint so there is no flash of
           the wrong colors. Defaults to dark when nothing is stored. -->
      <script>
        (function () {
          try {
            var saved = localStorage.getItem("sgx-theme");
            if (saved === "light") {
              document.documentElement.classList.remove("dark");
            } else {
              document.documentElement.classList.add("dark");
            }
          } catch (e) {
            document.documentElement.classList.add("dark");
          }
        })();
      </script>
      <script type="module" crossorigin src="/assets/zoom-DvxR64DL.js"></script>
      <link rel="stylesheet" crossorigin href="/assets/AL01AlertsList-P3VnV3Ol.css">
    </head>

    <body>
      <div id="root"></div>
    </body>
  </html>
