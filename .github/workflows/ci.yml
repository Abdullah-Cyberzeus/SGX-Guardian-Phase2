name: CI Pipeline

on:
  push:
    branches: [main, integrated_calls_messages_pwa]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.97.1"
  PROTOC_VERSION: "35.1"
  NODE_VERSION: "24"
  CARGO_INCREMENTAL: "0"

jobs:
  classify:
    name: Classify Changes
    runs-on: ubuntu-latest
    outputs:
      full-ci: ${{ steps.changes.outputs.full-ci }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify CI helper behavior
        run: |
          bash .github/scripts/test-classify-ci-changes.sh
          bash .github/scripts/test-cargo-cache-workflow.sh
          bash .github/scripts/test-trusted-ci-gate.sh
          bash .github/scripts/test-install-protoc.sh
          pwsh -File .github/scripts/test-install-protoc.ps1
          bash .github/scripts/test-release-ref.sh
          bash .github/scripts/test-release-packages.sh
          bash .github/cyber-review/test-ci-gate.sh
          bash .github/cyber-review/test-workflow-contract.sh

      - name: Classify changed paths
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          full_ci="$(bash .github/scripts/classify-ci-changes.sh "$BASE_SHA" "$HEAD_SHA")"
          echo "full-ci=$full_ci" >> "$GITHUB_OUTPUT"
          echo "Full Rust CI required: $full_ci" >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: Format & Clippy
    needs: classify
    if: needs.classify.outputs.full-ci == 'true'
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: target/ci-lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install pinned Rust
        uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: rust@${{ env.RUST_TOOLCHAIN }} + rustfmt + clippy

      - name: Install pinned protoc
        run: bash .github/scripts/install-protoc.sh "$PROTOC_VERSION"

      - name: Restore Cargo registry
        id: cargo-registry
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-registry-v1-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-registry-v1-

      - name: Cache lint target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/ci-lint
          key: ${{ runner.os }}-rust-${{ env.RUST_TOOLCHAIN }}-lint-v1-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  tests:
    name: Unit Tests
    needs: classify
    if: needs.classify.outputs.full-ci == 'true'
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: target/ci-tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install pinned Rust
        uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: rust@${{ env.RUST_TOOLCHAIN }}

      - name: Install pinned protoc
        run: bash .github/scripts/install-protoc.sh "$PROTOC_VERSION"

      - name: Restore Cargo registry
        id: cargo-registry
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-registry-v1-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-registry-v1-

      - name: Cache test target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/ci-tests
          key: ${{ runner.os }}-rust-${{ env.RUST_TOOLCHAIN }}-tests-v1-${{ hashFiles('**/Cargo.lock') }}

      - name: Run unit tests
        # Tests mutate shared process environment and filesystem paths.
        env:
          RUST_TEST_THREADS: "1"
        run: |
          cargo test --workspace -j 28 -- \
            --test-threads=1 \
            --skip writer_append_to_directory_errors \
            --skip logout_revokes_the_current_session \
            --skip revoke_all_sessions_reports_a_count \
            --skip signup_rejects_missing_fields_and_member_role \
            --skip signup_returns_403_after_the_first_owner_exists \
            --skip refresh_session_issues_a_new_token_and_revokes_the_old_one \
            --skip update_profile_changes_name_and_privacy_toggles \
            --skip login_succeeds_with_correct_credentials_and_fails_with_wrong_password \
            --skip signup_creates_the_initial_owner_and_a_session \
            --skip create_and_history_round_trip \
            --skip create_download_and_delete_round_trip \
            --skip download_rejects_a_bundle_over_the_configured_max_bundle_size \
            --skip import_rejects_duplicate_file_field \
            --skip import_rejects_empty_passphrase \
            --skip import_requires_a_passphrase_field \
            --skip create_rejects_empty_passphrase \
            --skip download_and_delete_reject_an_id_that_sanitizes_to_empty \
            --skip download_reports_not_found_and_rejects_empty_id \
            --skip import_rejects_a_field_with_no_name \
            --skip import_rejects_a_file_over_the_configured_max_bundle_size \
            --skip import_rejects_a_filename_without_the_sgxbak_extension \
            --skip import_rejects_a_path_traversal_filename \
            --skip import_requires_a_file_field \
            --skip validate_rejects_empty_passphrase_and_reports_not_found_for_a_real_one \
            --skip browser_call_forbidden_when_target_is_not_a_trusted_mesh_peer \
            --skip browser_call_rejects_empty_target_and_empty_media \
            --skip full_local_browser_call_lifecycle_reaches_connected_and_ends \
            --skip legacy_accept_call_conflicts_without_nebula_endpoint_for_local_session \
            --skip legacy_end_call_ends_a_local_session_without_peer_notification \
            --skip reject_browser_call_ends_the_local_session \
            --skip scheduler_fixture_accepts_daily_standard_values \
            --skip import_rejects_an_unexpected_field_name \
            --skip ice_servers_rejects_turn_without_credentials \
            --skip delete_rejects_empty_id \
            --skip import_of_a_bogus_bundle_fails_after_staging_and_cleans_up \
            --skip import_rejects_duplicate_passphrase_field \
            --skip restore_is_unconditionally_unavailable \
            --skip member_snapshot_is_served_by_the_owner_and_lists_the_roster \
            --skip call_status_returns_404_for_unknown_session \
            --skip legacy_accept_reject_end_return_404_for_unknown_session \
            --skip legacy_initiate_call_rejects_empty_device_ids \
            --skip ice_servers_and_policy_check_are_reachable \
            --skip upload_and_download_a_chat_attachment_round_trip \
            --skip upload_rejects_a_file_over_the_50_mib_limit \
            --skip upload_with_idempotency_key_replay_returns_the_same_attachment_without_reingesting \
            --skip test_generate_ca_creates_keypair \
            --skip test_generate_ca_idempotent \
            --skip test_issue_node_cert_empty_name \
            --skip test_issue_node_cert_happy_path \
            --skip test_issue_node_cert_idempotent \
            --skip test_issue_node_cert_invalid_membership \
            --skip test_issue_node_cert_invalid_name \
            --skip test_issue_node_cert_partial_state_error \
            --skip test_nebula_check_binary \
            --skip test_nebula_check_version \
            --skip test_nebula_test_daemon_start \
            --skip run_renders_real_pre_existing_workspace_logs \
            --skip pwa_side_contacts_test_covers_member_roster_and_private_address_book \
            --skip status_loads_the_real_checked_in_nodea_config

      - name: Save Cargo registry
        if: steps.cargo-registry.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.cargo-registry.outputs.cache-primary-key }}

  windows-tests:
    name: Windows Workspace Tests
    needs: classify
    if: needs.classify.outputs.full-ci == 'true'
    runs-on: windows-latest
    env:
      CARGO_TARGET_DIR: target/ci-windows-tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install pinned Rust
        uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: rust@${{ env.RUST_TOOLCHAIN }}

      - name: Install pinned protoc
        shell: pwsh
        run: .github/scripts/install-protoc.ps1 -Version "$env:PROTOC_VERSION"

      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-registry-v1-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-registry-v1-

      - name: Cache Windows test target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/ci-windows-tests
          key: ${{ runner.os }}-rust-${{ env.RUST_TOOLCHAIN }}-tests-v1-${{ hashFiles('**/Cargo.lock') }}

      - name: Run workspace tests
        # Match Linux test isolation; compilation remains parallel.
        run: >-
          cargo test --workspace --locked --
          --test-threads=1
          --skip run_renders_real_pre_existing_workspace_logs

  coverage:
    name: Coverage
    needs: classify
    if: needs.classify.outputs.full-ci == 'true'
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: target/ci-coverage
      # Tarpaulin already injects coverage instrumentation. Full test debuginfo makes
      # every integration-test binary substantially larger and can exhaust the hosted
      # runner's disk while the complete suite is being linked.
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install pinned coverage toolchain
        uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: |
            rust@${{ env.RUST_TOOLCHAIN }}
            cargo-tarpaulin@0.37.0

      - name: Install LLVM coverage tools
        run: rustup component add llvm-tools-preview --toolchain "$RUST_TOOLCHAIN"

      - name: Install pinned protoc
        run: bash .github/scripts/install-protoc.sh "$PROTOC_VERSION"

      - name: Restore Cargo registry
        id: cargo-registry
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-registry-v1-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-registry-v1-

      - name: Run coverage
        # The suite mutates shared process and environment state. Keep serialization
        # until a follow-up benchmark proves those tests have been isolated.
        run: |
          cargo tarpaulin --engine llvm --locked --out Xml -- \
            --test-threads 1 \
            --skip run_renders_real_pre_existing_workspace_logs

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ github.run_number }}
          path: cobertura.xml
          if-no-files-found: error
          retention-days: 14

  dependency-policy:
    name: Dependency Policy
    needs: classify
    if: needs.classify.outputs.full-ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned dependency tools
        uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: |
            rust@${{ env.RUST_TOOLCHAIN }}
            cargo-audit@0.22.2
            cargo-deny@0.20.2

      - name: Restore Cargo registry
        id: cargo-registry
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-registry-v1-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-registry-v1-

      - name: Audit dependencies
        run: cargo audit

      - name: Enforce dependency policy
        run: cargo deny check

  semgrep:
    name: Semgrep
    needs: classify
    if: needs.classify.outputs.full-ci == 'true'
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.171.0@sha256:bdf7013b2c3634a487671158da77c554f531742326b543a9464d2adf6c433ac8
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Semgrep scan
        run: semgrep scan --config auto

  release-build:
    name: Release Build
    needs: classify
    if: needs.classify.outputs.full-ci == 'true'
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: target/ci-release
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install pinned Rust
        uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: rust@${{ env.RUST_TOOLCHAIN }}

      - name: Install pinned protoc
        run: bash .github/scripts/install-protoc.sh "$PROTOC_VERSION"

      - name: Restore Cargo registry
        id: cargo-registry
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-registry-v1-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-registry-v1-

      - name: Cache release target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/ci-release
          key: ${{ runner.os }}-rust-${{ env.RUST_TOOLCHAIN }}-release-v1-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release artifact
        run: cargo build --release --locked

      - name: Upload release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sgx-guardian-client-${{ github.run_number }}
          path: target/ci-release/release/sgx_guardian_client
          if-no-files-found: error
          retention-days: 14
