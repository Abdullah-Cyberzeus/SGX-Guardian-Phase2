name: CI Pipeline

on:
  push:
    branches: [main, integrated_calls_messages_pwa]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.97.1"
  PROTOC_VERSION: "35.1"
  NODE_VERSION: "24"
  CARGO_INCREMENTAL: "0"
  # Shared by Linux tests, Windows tests, and coverage. Keep this list in one
  # place so every CI lane excludes exactly the same environment-dependent tests.
  CI_TEST_SKIP_ARGS: >-
    --skip writer_append_to_directory_errors
    --skip test_request_cert_approved_flow 

jobs:
  classify:
    name: Classify Changes
    runs-on: ubuntu-latest
    outputs:
      full-ci: ${{ steps.changes.outputs.full-ci }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify CI helper behavior
        run: |
          bash .github/scripts/test-classify-ci-changes.sh
          bash .github/scripts/test-cargo-cache-workflow.sh
          bash .github/scripts/test-trusted-ci-gate.sh
          bash .github/scripts/test-install-protoc.sh
          pwsh -File .github/scripts/test-install-protoc.ps1
          bash .github/scripts/test-release-ref.sh
          bash .github/scripts/test-release-packages.sh
          bash .github/cyber-review/test-ci-gate.sh
          bash .github/cyber-review/test-workflow-contract.sh

      - name: Classify changed paths
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          full_ci="$(bash .github/scripts/classify-ci-changes.sh "$BASE_SHA" "$HEAD_SHA")"
          echo "full-ci=$full_ci" >> "$GITHUB_OUTPUT"
          echo "Full Rust CI required: $full_ci" >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: Format & Clippy
    needs: classify
    if: needs.classify.outputs.full-ci == 'true'
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: target/ci-lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install pinned Rust
        uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: rust@${{ env.RUST_TOOLCHAIN }} + rustfmt + clippy

      - name: Install pinned protoc
        run: bash .github/scripts/install-protoc.sh "$PROTOC_VERSION"

      - name: Restore Cargo registry
        id: cargo-registry
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-registry-v1-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-registry-v1-

      - name: Cache lint target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/ci-lint
          key: ${{ runner.os }}-rust-${{ env.RUST_TOOLCHAIN }}-lint-v1-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  tests:
    name: Unit Tests
    needs: classify
    if: needs.classify.outputs.full-ci == 'true'
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: target/ci-tests
      # Keep test binaries small and prevent rust-lld from exhausting runner
      # resources in its own parallel linker threads.
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUSTFLAGS: "-C link-arg=-Wl,--threads=1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install pinned Rust
        uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: rust@${{ env.RUST_TOOLCHAIN }}

      - name: Install pinned protoc
        run: bash .github/scripts/install-protoc.sh "$PROTOC_VERSION"

      - name: Restore Cargo registry
        id: cargo-registry
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-registry-v1-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-registry-v1-

      - name: Cache test target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/ci-tests
          key: ${{ runner.os }}-rust-${{ env.RUST_TOOLCHAIN }}-tests-v1-${{ hashFiles('**/Cargo.lock') }}

      - name: Run unit tests
        # Tests mutate shared process environment and filesystem paths.
        env:
          RUST_TEST_THREADS: "1"
        run: cargo test --workspace --locked -j 2 -- --test-threads=1 $CI_TEST_SKIP_ARGS

      - name: Save Cargo registry
        if: steps.cargo-registry.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.cargo-registry.outputs.cache-primary-key }}

  windows-tests:
    name: Windows Workspace Tests
    needs: classify
    if: needs.classify.outputs.full-ci == 'true'
    runs-on: windows-latest
    env:
      CARGO_TARGET_DIR: target/ci-windows-tests
      # Windows-only exclusions for tests that require Unix services,
      # interfaces, signals, permissions, or filesystem behavior.
      WINDOWS_TEST_SKIP_ARGS: >-
        --skip mark_as_read_updates_read_by_for_admin_caller
        --skip every_scan_endpoint_invokes_the_cli_and_reports_its_outcome
        --skip start_reports_failure_when_systemctl_cannot_start_the_service
        --skip status_reports_real_systemctl_state_and_file_backed_counts
        --skip listener_task_logs_and_returns_when_the_bind_port_is_already_taken
        --skip enable_nat_builds_the_full_rule_set_then_fails_at_the_enforcement_engine
        --skip interface_network_cidr_derives_the_subnet_from_a_real_interface
        --skip duplicate_start_is_idempotent_and_does_not_respawn
        --skip send_sighup_to_unhandled_process_terminates_it_and_marks_crashed
        --skip send_signal_success_leads_to_unexpected_crash
        --skip disable_forwarding_surfaces_the_unprivileged_write_refusal
        --skip enable_forwarding_surfaces_the_unprivileged_write_refusal
        --skip is_forwarding_enabled_reports_the_live_sysctl_value
        --skip get_interface_ipv4_parses_the_real_loopback_interface
        --skip check_interface_exists_true_for_loopback_false_for_fake_interface
        --skip emergency_key_rotation_reports_executed_on_success
        --skip emergency_key_rotation_reports_failed_on_nonzero_exit
        --skip emergency_key_rotation_reports_failed_when_cli_not_found
        --skip execute_action_dispatches_every_variant_via_safe_paths
        --skip start_dual_wifi_mode_errors_when_hotspot_interface_missing_but_uplink_present
        --skip verify_interface_exists_true_for_loopback
        --skip every_identity_path_is_redirected_under_the_state_dir
        --skip reload_or_restart_suricata_surfaces_a_real_systemctl_failure
        --skip test_node_restart_endpoint
        --skip cert_service_request_certificate_fails_creating_requests_dir_member_role
        --skip cert_service_request_certificate_role_selection_and_node_lock_reuse
        --skip request_certificate_from_ca_approved_with_ca_cert_aborts_on_permission_denied
        --skip registry_path_is_temp_file
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install pinned Rust
        uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: rust@${{ env.RUST_TOOLCHAIN }}

      - name: Install pinned protoc
        shell: pwsh
        run: .github/scripts/install-protoc.ps1 -Version "$env:PROTOC_VERSION"

      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-registry-v1-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-registry-v1-

      - name: Cache Windows test target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/ci-windows-tests
          key: ${{ runner.os }}-rust-${{ env.RUST_TOOLCHAIN }}-tests-v1-${{ hashFiles('**/Cargo.lock') }}

      - name: Run workspace tests
        # Match Linux test isolation; compilation remains parallel.
        shell: bash
        run: cargo test --workspace --locked -j 2 -- --test-threads=1 $CI_TEST_SKIP_ARGS $WINDOWS_TEST_SKIP_ARGS

  coverage:
    name: Coverage
    needs: classify
    if: needs.classify.outputs.full-ci == 'true'
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: target/ci-coverage
      # Tarpaulin already injects coverage instrumentation. Full test debuginfo makes
      # every integration-test binary substantially larger and can exhaust the hosted
      # runner's disk while the complete suite is being linked.
      CARGO_PROFILE_TEST_DEBUG: "0"
      # Cargo's -j flag does not limit LLD's internal parallelism. The hosted runner
      # has crashed inside llvm::parallelFor while linking these large test binaries.
      RUSTFLAGS: "-C link-arg=-Wl,--threads=1"
      # Override the repository-wide single-job default without allowing coverage
      # compilation to consume every hosted-runner core at once.
      CARGO_BUILD_JOBS: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Reclaim disk space for instrumented test binaries
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /

      - name: Install pinned Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install pinned coverage toolchain
        uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: |
            rust@${{ env.RUST_TOOLCHAIN }}
            cargo-tarpaulin@0.37.0

      - name: Install LLVM coverage tools
        run: rustup component add llvm-tools-preview --toolchain "$RUST_TOOLCHAIN"

      - name: Install pinned protoc
        run: bash .github/scripts/install-protoc.sh "$PROTOC_VERSION"

      - name: Restore Cargo registry
        id: cargo-registry
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-registry-v1-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-registry-v1-

      - name: Build CLI required by handler coverage tests
        run: cargo build -p sgx-pa-cli --bin sgx-pa-cli --locked

      - name: Run coverage
        # The suite mutates shared process and environment state. Keep serialization
        # until a follow-up benchmark proves those tests have been isolated.
        # Keep the CLI built above: several handler tests invoke that real binary.
        run: cargo tarpaulin --no-dead-code --engine llvm --skip-clean --locked --out Xml -- --test-threads 1 $CI_TEST_SKIP_ARGS

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ github.run_number }}
          path: cobertura.xml
          if-no-files-found: error
          retention-days: 14

  dependency-policy:
    name: Dependency Policy
    needs: classify
    if: needs.classify.outputs.full-ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned dependency tools
        uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: |
            rust@${{ env.RUST_TOOLCHAIN }}
            cargo-audit@0.22.2
            cargo-deny@0.20.2

      - name: Restore Cargo registry
        id: cargo-registry
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-registry-v1-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-registry-v1-

      - name: Audit dependencies
        run: cargo audit

      - name: Enforce dependency policy
        run: cargo deny check

  semgrep:
    name: Semgrep
    needs: classify
    if: needs.classify.outputs.full-ci == 'true'
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.171.0@sha256:bdf7013b2c3634a487671158da77c554f531742326b543a9464d2adf6c433ac8
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Semgrep scan
        run: semgrep scan --config auto

  release-build:
    name: Release Build
    needs: classify
    if: needs.classify.outputs.full-ci == 'true'
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: target/ci-release
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install pinned Rust
        uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: rust@${{ env.RUST_TOOLCHAIN }}

      - name: Install pinned protoc
        run: bash .github/scripts/install-protoc.sh "$PROTOC_VERSION"

      - name: Restore Cargo registry
        id: cargo-registry
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-registry-v1-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-registry-v1-

      - name: Cache release target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/ci-release
          key: ${{ runner.os }}-rust-${{ env.RUST_TOOLCHAIN }}-release-v1-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release artifact
        run: cargo build --release --locked

      - name: Upload release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sgx-guardian-client-${{ github.run_number }}
          path: target/ci-release/release/sgx_guardian_client
          if-no-files-found: error
          retention-days: 14
