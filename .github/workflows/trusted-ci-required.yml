name: Trusted CI Required

# This privileged workflow is loaded from the default branch. It never checks
# out or executes pull request code; it only inspects GitHub API metadata and
# publishes the CI Required status on the exact pull request head SHA.
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: trusted-ci-required-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  pull-requests: read
  statuses: write

jobs:
  trusted-ci-required:
    name: Publish trusted CI Required
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout trusted gate from the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Evaluate CI Pipeline on the exact head SHA
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash .github/scripts/trusted-ci-gate.sh
