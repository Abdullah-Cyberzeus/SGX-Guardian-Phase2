name: Docker Agent Image (multi-arch)

on:
  push:
    branches: [ "feat/112-116-emergency-addons" ]
    paths:
      - 'docker/**'
      - '.github/workflows/docker-agent.yml'
  pull_request:
    branches: [ "feat/112-116-emergency-addons" ]
    paths:
      - 'docker/**'
      - '.github/workflows/docker-agent.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            expect_machine: "3e00"
          - platform: linux/arm64
            arch: arm64
            expect_machine: "b700"
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build agent image for ${{ matrix.platform }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.agent
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          tags: sgx-guardian:ci-${{ matrix.arch }}

      # Belt-and-suspenders: the Dockerfile's own nebula-fetch stage already
      # fails the build on a checksum or arch mismatch. This re-checks the
      # ELF bytes from outside the image so a regression here is visible as
      # a CI failure even if someone weakens the in-Dockerfile check later.
      - name: Verify nebula ELF machine type (${{ matrix.arch }})
        run: |
          actual=$(docker run --rm --platform ${{ matrix.platform }} \
            --entrypoint sh sgx-guardian:ci-${{ matrix.arch }} \
            -c "od -An -tx1 -j18 -N2 /usr/local/bin/nebula | tr -d ' \n'")
          echo "nebula ELF e_machine=${actual}, expected ${{ matrix.expect_machine }}"
          [ "$actual" = "${{ matrix.expect_machine }}" ]

      - name: Verify nebula-cert ELF machine type (${{ matrix.arch }})
        run: |
          actual=$(docker run --rm --platform ${{ matrix.platform }} \
            --entrypoint sh sgx-guardian:ci-${{ matrix.arch }} \
            -c "od -An -tx1 -j18 -N2 /usr/local/bin/nebula-cert | tr -d ' \n'")
          echo "nebula-cert ELF e_machine=${actual}, expected ${{ matrix.expect_machine }}"
          [ "$actual" = "${{ matrix.expect_machine }}" ]
