name: Cybersecurity Review Gate

# Cost-lane redesign (ADR 0003, adapted from Verjson/.github ai-review-merge.yml):
#   * The review runs ONCE per ready PR (opened/reopened/ready_for_review), not
#     on every push. Re-run by applying the `re-review` label (auto-removed).
#   * `classify` (free, deterministic bash) fast-lanes deletions-only and
#     docs-only PRs — no model is invoked.
#   * CI-first: the model runs only AFTER the rest of CI is green on the head
#     SHA, so red PRs cost $0.
#   * Model tiering: docs/tests/CLI-only diffs get Haiku; anything touching
#     security-relevant paths gets Sonnet.
#   * Merge is workflow-driven: on gate pass + green CI, squash-merge with the
#     org admin token (bypasses check-staleness on the reviewed SHA). Human
#     opt-outs — `hold` label, "DO NOT MERGE" in the title, draft — are
#     re-checked at merge time.
#
# The model NEVER decides merge-ability — it writes structured findings and the
# deterministic gate (.github/cyber-review/gate.py) applies the fixed severity
# policy (PRE_GA: critical blocks; high and below are auto-filed as
# security-debt issues — see ADR 0002).

on:
  # The privileged workflow definition always comes from the base branch.
  # PR content is checked out later as review data and is never executed.
  pull_request_target:
    branches: [ main ]
    types: [ opened, reopened, ready_for_review, labeled ]

concurrency:
  group: cyber-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PR_NUMBER: ${{ github.event.pull_request.number }}
  REPO: ${{ github.repository }}

jobs:
  classify:
    name: Classify PR lane
    # Run on ready events or the re-review label; never on drafts or opted-out
    # PRs.
    if: >-
      (github.event.action != 'labeled' ||
       github.event.label.name == 're-review') &&
      !github.event.pull_request.draft &&
      !contains(github.event.pull_request.labels.*.name, 'hold') &&
      !contains(github.event.pull_request.title, 'DO NOT MERGE')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    outputs:
      lane: ${{ steps.classify.outputs.lane }}
      reason: ${{ steps.classify.outputs.reason }}
      model: ${{ steps.classify.outputs.model }}
      budget_usd: ${{ steps.classify.outputs.budget_usd }}
      head_sha: ${{ steps.classify.outputs.head_sha }}
      base_sha: ${{ steps.classify.outputs.base_sha }}
    steps:
      - name: Classify
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out() { echo "$1=$2" >> "$GITHUB_OUTPUT"; }

          meta=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json labels,title,isDraft,headRefOid,baseRefOid)
          # Re-check current opt-outs before consuming the re-review label.
          if jq -e '(.labels | map(.name) | index("hold")) or (.title | contains("DO NOT MERGE")) or .isDraft' <<<"$meta" >/dev/null; then
            out lane held; out reason "held by human opt-out"; out model none
            out head_sha "$(jq -r .headRefOid <<<"$meta")"
            out base_sha "$(jq -r .baseRefOid <<<"$meta")"
            exit 0
          fi
          out head_sha "$(jq -r .headRefOid <<<"$meta")"
          out base_sha "$(jq -r .baseRefOid <<<"$meta")"

          # Consume the re-review label so it can be re-applied later.
          gh pr edit "$PR_NUMBER" --repo "$REPO" --remove-label re-review 2>/dev/null || true

          files=$(gh api "repos/$REPO/pulls/$PR_NUMBER/files" --paginate --jq '.[]' | jq -s .)

          # Fast lane: docs-only. (No deletions-only lane: removing code can
          # remove a security control, so deletions get full review.)
          if [ "$(jq length <<<"$files")" -gt 0 ] && \
             jq -e '[.[].filename] | all(test("(^docs/|\\.(md|txt)$)"))' <<<"$files" >/dev/null; then
            out lane fast; out reason "docs-only diff"; out model none
            exit 0
          fi

          # AI lane — tier the model by sensitivity of touched paths. budget_usd
          # is a per-review runaway CEILING (paired with --max-turns), not a
          # target: this gate does a full multi-dimension review of large diffs
          # (a 64k-line CRL PR ran ~20 min on Sonnet), so the cap must sit well
          # above real spend or it truncates a legitimate review. Tune down once
          # actual per-run cost is known.
          if jq -e '[.[].filename] | any(test("(^|/)\\.github/|src/(api|crl|did|secure_element)|key_manager|crypto|auth|secret|polic"; "i"))' <<<"$files" >/dev/null; then
            out model claude-sonnet-5
            out budget_usd 8.00
          else
            out model claude-haiku-4-5
            out budget_usd 1.50
          fi
          out lane ai; out reason "code diff — full cyber-review"

  cyber-review:
    name: Cyber-review gate
    needs: classify
    if: needs.classify.outputs.lane == 'ai'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write
      checks: read
      statuses: read
      issues: write
    steps:
      - name: Check whether the review is configured
        id: cfg
        run: echo "enabled=${{ secrets.ANTHROPIC_API_KEY != '' }}" >> "$GITHUB_OUTPUT"

      # Fail-closed: with workflow-driven auto-merge, "pass as not configured"
      # would mean zero review before merge. No key -> no review -> no merge.
      - name: Not configured — failing closed
        if: steps.cfg.outputs.enabled != 'true'
        run: |
          echo "## 🛡️ Cyber-review gate" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "❌ \`ANTHROPIC_API_KEY\` secret is not set — no review is possible, failing closed (nothing auto-merges)." >> "$GITHUB_STEP_SUMMARY"
          exit 1

      # Fetch policy from the exact base commit. The privileged review never
      # executes gate logic supplied by the pull request it is judging.
      - name: Load base-owned review policy
        if: steps.cfg.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ needs.classify.outputs.base_sha }}
        run: |
          set -euo pipefail
          policy_dir="$RUNNER_TEMP/cyber-review-policy"
          mkdir -p "$policy_dir"
          for path in \
            .github/cyber-review/ci-gate.sh \
            .github/cyber-review/gate.py \
            .github/cyber-review/file_findings.py; do
            gh api "repos/$REPO/contents/$path?ref=$BASE_SHA" --jq .content |
              base64 --decode > "$policy_dir/$(basename "$path")"
          done
          chmod +x "$policy_dir/ci-gate.sh"

      # CI-first: the model is only invoked after the two deterministic,
      # base-owned required contexts pass on this exact head SHA.
      - name: Wait for exact-SHA required CI
        if: steps.cfg.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ needs.classify.outputs.head_sha }}
        run: bash "$RUNNER_TEMP/cyber-review-policy/ci-gate.sh"

      - name: Detect break-glass override label
        if: steps.cfg.outputs.enabled == 'true'
        id: override
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh pr view "$PR_NUMBER" --repo "$REPO" --json labels --jq '.labels[].name' | grep -qx 'security-override'; then
            echo "has_override=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_override=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout PR head (full history for base..head diff)
        if: steps.cfg.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.classify.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare non-executable review evidence
        if: steps.cfg.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          context_dir="$GITHUB_WORKSPACE/.cyber-review-context"
          rm -rf -- "$context_dir"
          mkdir "$context_dir"
          git diff --no-ext-diff --no-textconv origin/main...HEAD \
            > "$context_dir/diff.patch"
          git diff --name-status --no-ext-diff --no-textconv origin/main...HEAD \
            > "$context_dir/files.txt"
          gh api "repos/$REPO/issues/$PR_NUMBER/comments?per_page=100" \
            --paginate --slurp |
            jq '[.[][] | select(.body | contains("Cybersecurity Code Review"))
              | {author:.user.login,created_at,body}]' \
            > "$context_dir/previous-reviews.json"
          gh api "repos/$REPO/pulls/$PR_NUMBER/comments?per_page=100" \
            --paginate --slurp |
            jq '[.[][] | select(.user.login == "coderabbitai[bot]")
              | {path,line,body}]' \
            > "$context_dir/coderabbit-comments.json"
          gh api "repos/$REPO/pulls/$PR_NUMBER/reviews?per_page=100" \
            --paginate --slurp |
            jq '[.[][] | select(.user.login == "coderabbitai[bot]")
              | {state,body}]' \
            > "$context_dir/coderabbit-reviews.json"

      - name: Run multi-dimension cybersecurity review
        id: review
        if: steps.cfg.outputs.enabled == 'true'
        uses: anthropics/claude-code-action@e90deca47693f9457b72f2b53c17d7c445a87342 # v1.0.171
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: >-
            --model ${{ needs.classify.outputs.model }}
            --max-turns 60
            --max-budget-usd ${{ needs.classify.outputs.budget_usd }}
            --allowedTools "Read,Grep,Glob"
            --disallowedTools "Bash,Write,Edit,NotebookEdit,mcp__*"
            --json-schema '{"type":"object","properties":{"findings":{"type":"array","items":{"type":"object","properties":{"id":{"type":"string"},"title":{"type":"string"},"severity":{"type":"string","enum":["critical","high","medium","low","info"]},"confidence":{"type":"string","enum":["high","medium","low"]},"file":{"type":"string"},"line":{"type":"integer","minimum":1},"category":{"type":"string","enum":["security","correctness","tests","architecture","simplification"]},"scenario":{"type":"string"},"recommendation":{"type":"string"},"sources":{"type":"array","items":{"type":"string"}}},"required":["id","title","severity","confidence","file","line","category","scenario","recommendation","sources"],"additionalProperties":false}}},"required":["findings"],"additionalProperties":false}'
          prompt: |
            You are the Lead/Judge of a cybersecurity code review of pull request
            #${{ env.PR_NUMBER }} in ${{ env.REPO }}. Repo root is the checkout.
            The PR base is `origin/main`; the exact reviewed head is
            `${{ needs.classify.outputs.head_sha }}`. Scope the review to
            `.cyber-review-context/diff.patch` and the changed paths in
            `.cyber-review-context/files.txt`.

            FIRST read `.cyber-review-context/previous-reviews.json`. If it
            contains a previous review, verify its findings against this diff.
            Do NOT re-litigate fixes you verify as correct or re-deep-dive
            unchanged code it already covered.

            Deterministic CI already verified that exact head with successful
            `CI Required` and `Static Analysis (CodeQL)` contexts. Treat those
            results as authoritative evidence. Do NOT run project code, builds,
            tests, linters, package managers, dependency tools, generators, or
            repository-controlled scripts. Your available tools intentionally
            permit only reading/searching the checkout. Return findings through
            the action's required structured output; do not write files.

            Review the diff across FIVE dimensions (treat each as a specialist lens):
              1. Security      — injection, authn/authz & trust-boundary flaws, crypto
                                 misuse, sensitive-data leakage, unsafe deserialization,
                                 confused-deputy, fail-open gates.
              2. Static/lint   — inspect the patch for correctness risks not covered by
                                 the already-green Clippy and CodeQL evidence.
              3. Tests         — assess whether changed behavior has adequate coverage;
                                 note missing coverage on the riskiest new logic.
              4. Architecture  — dependency and migration/persistence
                                 safety, concurrency, tenant/isolation, structural design.
              5. Simplification— scope creep, duplication, over-complex patches.

            ALSO ingest existing automated reviews as additional input:
              `.cyber-review-context/coderabbit-comments.json`
              `.cyber-review-context/coderabbit-reviews.json`
            Corroborate/dedupe against your own findings; surface theirs too. Verify
            every finding's cited location against the real code before reporting it.

            Report ONLY real, defensible issues with a concrete failure scenario.
            Return an object matching the provided JSON schema. If there are no
            real issues, return {"findings":[]}. Do NOT state a merge decision —
            the deterministic gate consumes the structured result.

      - name: Materialize structured findings
        if: steps.cfg.outputs.enabled == 'true'
        env:
          STRUCTURED_FINDINGS: ${{ steps.review.outputs.structured_output }}
        run: |
          set -euo pipefail
          if [ -z "$STRUCTURED_FINDINGS" ]; then
            echo "Claude action returned no structured findings; failing closed." >&2
            exit 1
          fi
          printf '%s\n' "$STRUCTURED_FINDINGS" \
            > "$RUNNER_TEMP/cyber-review-findings.json"

      - name: Apply deterministic severity gate
        if: steps.cfg.outputs.enabled == 'true'
        env:
          HAS_OVERRIDE: ${{ steps.override.outputs.has_override }}
          # Pre-GA posture (ADR 0002): only criticals block; flip to "false"
          # (or delete) at the release-hardening milestone to restore
          # critical+high blocking.
          PRE_GA: "true"
        run: >-
          python3 "$RUNNER_TEMP/cyber-review-policy/gate.py"
          "$RUNNER_TEMP/cyber-review-findings.json"

      # Only reached when the gate passed: file the surviving non-blocking
      # high/medium/low findings as tracked security-debt issues so the pre-GA
      # posture never lets debt go invisible (ADR 0002).
      - name: File non-blocking findings as security-debt issues
        if: steps.cfg.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ env.PR_NUMBER }}
          REPO: ${{ env.REPO }}
          PRE_GA: "true"
        run: >-
          python3 "$RUNNER_TEMP/cyber-review-policy/file_findings.py"
          "$RUNNER_TEMP/cyber-review-findings.json"

  merge:
    name: Merge on green
    needs: [ classify, cyber-review ]
    # Fast lane merges without a model; AI lane merges only when the gate passed.
    if: >-
      always() && needs.classify.result == 'success' &&
      (needs.classify.outputs.lane == 'fast' ||
       (needs.classify.outputs.lane == 'ai' && needs.cyber-review.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
      checks: read
      pull-requests: read
      statuses: read
    env:
      LANE: ${{ needs.classify.outputs.lane }}
      LANE_REASON: ${{ needs.classify.outputs.reason }}
      REVIEWED_SHA: ${{ needs.classify.outputs.head_sha }}
    steps:
      - name: Load base-owned CI gate
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ needs.classify.outputs.base_sha }}
        run: |
          set -euo pipefail
          gh api \
            "repos/$REPO/contents/.github/cyber-review/ci-gate.sh?ref=$BASE_SHA" \
            --jq .content | base64 --decode \
            > "$RUNNER_TEMP/cyber-review-ci-gate.sh"
          chmod +x "$RUNNER_TEMP/cyber-review-ci-gate.sh"

      - name: Verify required CI on reviewed SHA
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ needs.classify.outputs.head_sha }}
        run: bash "$RUNNER_TEMP/cyber-review-ci-gate.sh"

      - name: Squash-merge reviewed head
        env:
          # The admin token is exposed only for the final opt-out checks and
          # exact-SHA merge, never while polling or running PR-controlled code.
          GH_TOKEN: ${{ secrets.TOKEN }}
        run: |
          set -euo pipefail
          # Re-check opt-outs at merge time: a `hold` added after classification
          # must still stop the merge.
          meta=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json labels,title,isDraft,state)
          if jq -e '(.labels | map(.name) | index("hold")) or (.title | contains("DO NOT MERGE")) or .isDraft' <<<"$meta" >/dev/null; then
            echo "PR #$PR_NUMBER held (label/title/draft); not merging."; exit 0
          fi
          if [ "$(jq -r .state <<<"$meta")" != "OPEN" ]; then
            echo "PR #$PR_NUMBER no longer open; nothing to do."; exit 0
          fi

          if [ "$LANE" = "fast" ]; then
            gh pr comment "$PR_NUMBER" --repo "$REPO" \
              --body "🤖 Fast-lane merge (no AI review needed): ${LANE_REASON}. CI green; squash-merging."
          fi

          # Pin to the reviewed SHA: a commit pushed after the review must not
          # merge unreviewed (re-apply `re-review` instead).
          head_now=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq .head.sha)
          if [ "$head_now" != "$REVIEWED_SHA" ]; then
            echo "Head moved since review ($REVIEWED_SHA -> $head_now); not merging. Apply re-review."
            exit 1
          fi
          echo "Merging PR #$PR_NUMBER (lane: $LANE) at reviewed SHA $REVIEWED_SHA."
          gh pr merge "$PR_NUMBER" --repo "$REPO" --squash --admin \
            --delete-branch --match-head-commit "$REVIEWED_SHA"
